<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blogs | Himalayan Voyage Nepal</title>
  <meta name="description" content="Travel guides, destination insights and helpful tips from Himalayan Voyage Nepal.">
  <link rel="stylesheet" href="css/style.css?v=1fb97092">
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="hero hero--slim">
      <div class="wrap"><div class="hero__inner">
        <div class="breadcrumbs"><a href="index.html">Home</a> / Blogs</div>
        <span class="eyebrow" style="color:#ffd08a">Travel Tips &amp; Articles</span>
        <h1>The travel journal</h1>
        <p class="lead">Guides, destination insights and practical tips to make every journey more enjoyable.</p>
      </div></div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="toolbar" id="blog-toolbar">
          <div class="toolbar__search">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
            <input type="search" id="blog-search" placeholder="Search articles…" aria-label="Search articles">
          </div>
          <div class="toolbar__sort">
            <label for="blog-sort">Sort by</label>
            <select id="blog-sort" aria-label="Sort articles">
              <option value="">Newest first</option>
              <option value="name">Title (A–Z)</option>
            </select>
          </div>
          <span class="toolbar__count" id="blog-count"></span>
        </div>

        <div class="grid grid--3" id="blog-grid"></div>

        <div class="custom-band reveal">
          <div>
            <h3>Have a question about travelling?</h3>
            <p>Our team answers route, visa and season questions every day &mdash; no obligation.</p>
          </div>
          <a class="btn btn--light" href="contact.html">Ask an Expert</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js?v=54c1c27e"></script>
  <script src="js/main.js?v=0c49df64"></script>
  <script src="js/blogs.js?v=d87cfbe1"></script>
</body>
</html>
