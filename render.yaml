# Render.com Blueprint — free tier deploy, no credit card.
#
# How to use:
#   1. Push this repo to GitHub (already done).
#   2. render.com → New → Blueprint → pick this repo → Apply.
# Render reads this file, builds the Dockerfile and gives you a
# https://<name>.onrender.com URL.
#
# Notes:
#   * Free instances sleep after ~15 min idle and cold-start in ~30 s.
#   * Free tier has no persistent disk, so the SQLite DB is recreated (and
#     re-seeded) from the bundled data on each deploy. Set ADMIN_PASSWORD to a
#     real value below so the admin account is not the demo one.
services:
  - type: web
    name: himalayan-voyage-nepal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/packages
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@himalayanvoyage.test
      - key: ADMIN_PASSWORD
        sync: false
