# Render Blueprint for Himalayan Voyage Nepal.
#
# Source of truth for the service configuration. Apply it from the Quickstart
# page (Add new -> Blueprint -> pick this repo -> Apply).
#
# IMPORTANT: there is deliberately NO envVars block here.
#
# Render treats a Blueprint-declared environment variable as authoritative and
# OVERWRITES the dashboard value. Declaring DATABASE_URL / JWT_SECRET /
# ADMIN_PASSWORD (even with sync: false) left all of them empty inside the
# container, so the app silently ran on the ephemeral SQLite file while the
# dashboard showed the variables as configured.
#
# Production variables therefore live ONLY in the dashboard:
#   Dashboard -> himalayan-voyage-nepal -> Environment
#     DATABASE_URL, JWT_SECRET, ADMIN_PASSWORD, ADMIN_EMAIL, NODE_VERSION

services:
  - type: web
    name: himalayan-voyage-nepal
    runtime: node
    plan: free
    branch: master
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
