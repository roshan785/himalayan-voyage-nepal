name: CI

# Gate every push and PR on tests, lint, dependency audit and a secret scan.
# Deployment itself is handled by the Render Blueprint (autoDeploy on master);
# `deploy-guard` below documents and re-checks the exact green conditions that
# must hold before Render is allowed to ship the commit, and fails loudly if a
# required check regressed. It also verifies the live service AFTER deploy so a
# bad release is visible immediately.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Tests, lint & audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npx eslint server.js src/ scripts/backup-db.js scripts/uptime-check.js

      - name: Syntax check every server module
        run: |
          for f in server.js src/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done

      - name: Dependency vulnerability audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Secret leak scan (fails if a real secret is committed)
        run: node scripts/secret-scan.js

      - name: Run test suite
        run: npm test

  deploy-guard:
    name: Deploy guard (post-deploy health)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Render redeploys automatically on the merge. Wait for the new container
      # and verify it reports PostgreSQL + persistence, then fail the workflow if
      # the release is unhealthy so the team is alerted by GitHub.
      - name: Wait for the running service to report healthy
        run: node scripts/deploy-verify.js
        env:
          DEPLOY_URL: https://himalayan-voyage-nepal-0sem.onrender.com
